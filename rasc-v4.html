<style>
:root{
  --navy:#06345B; --teal:#0E6981;
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F5F8FA; --fg:#0F2233; --muted:#5B6B7A; --line:#DCE3E9;
  --brand:#06345B; --on-brand:#FFFFFF; --accent:#E58F00; --on-accent:#1E1300; --link:#0E6981;
  --ok:#2F7D3A; --ok-bg:#E3F2E5; --warn:#9A5B00; --warn-bg:#FDF0D9; --bad:#B3261E; --bad-bg:#FBE4E2; --info-bg:#E2EFF3;
  --font:"Figtree","Segoe UI",system-ui,sans-serif; --urdu:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#08121C; --surface:#0F1D2A; --surface-2:#132536; --fg:#E4ECF2; --muted:#93A4B3; --line:#21374A;
  --brand:#0C4573; --accent:#F2A93B; --link:#F2A93B;
  --ok:#6CC67A; --ok-bg:#16301C; --warn:#F2B35A; --warn-bg:#33260F; --bad:#F2867E; --bad-bg:#3A1714; --info-bg:#13303B; color-scheme:dark }}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body.ur .t{font-family:var(--urdu);line-height:2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){.shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
header.top{background:var(--brand);color:var(--on-brand);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header.top img{height:34px;width:auto;background:#fff;border-radius:8px;padding:3px}
header.top .who{flex:1;min-width:0}
header.top .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

   RASC App — live version. Talks to Supabase (database + login).
   Every permission is checked by the database (Row Level Security);
   the screens below only show what the database allows.
   ===================================================================== */
const CFG = window.RASC_CONFIG || {};
const URL_ = (CFG.SUPABASE_URL || '').replace(/\/+$/, '');
const KEY = CFG.SUPABASE_ANON_KEY || '';
const CONFIGURED = /^https?:\/\//.test(URL_) && KEY && !KEY.startsWith('PASTE');

/* ---------------- small helpers ---------------- */
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pkr = (n) => 'Rs ' + Math.round(Number(n) || 0).toLocaleString('en-PK');
const iso = (d) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const today = () => iso(new Date());
const monthStart = (s = today()) => s.slice(0,7) + '-01';
const fmtDate = (s) => s ? new Date(s.slice(0,10) + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
const fmtMonth = (s) => s ? new Date(s.slice(0,10) + 'T00:00:00').toLocaleDateString('en-GB', {month:'long', year:'numeric'}) : '';
const initials = (n) => String(n || '?').split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
const enc = encodeURIComponent;
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const $ = (id) => document.getElementById(id);
const val = (id) => ($(id)?.value ?? '').trim();
function grade(pct){ const g = ctx.grades?.length ? ctx.grades : [{grade:'A+',min_percent:80},{grade:'A',min_percent:70},{grade:'B',min_percent:60},{grade:'C',min_percent:50},{grade:'D',min_percent:33},{grade:'F',min_percent:0}];
  return ([...g].sort((a, b) => b.min_percent - a.min_percent).find(x => pct >= Number(x.min_percent)) || {grade:'F'}).grade; }

let session = store.get('rasc.session');
async function authCall(path, body, token){
  const r = await fetch(URL_ + '/auth/v1/' + path, {method:'POST', headers:{apikey:KEY, 'Content-Type':'application/json', ...(token ? {Authorization:'Bearer ' + token} : {})}, body:JSON.stringify(body || {})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Login failed');
  return j;
}
function keepSession(j){ session = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Math.floor(Date.now()/1000) + (j.expires_in || 3600), user:j.user}; store.set('rasc.session', session); }
// Usernames (e.g. rasc-0001) are stored as plus-addresses of the owner's Gmail,
// so Supabase accepts them; no email is ever sent to them because "Confirm email" is off.
const LOGIN_BASE = 'pakrecords71', LOGIN_DOMAIN = 'gmail.com';
const toEmail = (u) => { u = String(u || '').trim().toLowerCase(); return u.includes('@') ? u : `${LOGIN_BASE}+${u.replace(/[^a-z0-9.-]/g, '')}@${LOGIN_DOMAIN}`; };
const fromEmail = (e) => { const m = String(e || '').match(new RegExp('^' + LOGIN_BASE + '\\+([^@]+)@' + LOGIN_DOMAIN.replace('.', '\\.') + '$')); return m ? m[1] : e; };
async function signUp(email, password){ return authCall('signup', {email, password}); }
async function signIn(email, password){ keepSession(await authCall('token?grant_type=password', {email, password})); }
async function freshToken(){
  if (!session) return null;
  if (session.expires_at - 60 > Date.now()/1000) return session.access_token;
  try { keepSession(await authCall('token?grant_type=refresh_token', {refresh_token:session.refresh_token})); return session.access_token; }
  catch(e){ signOutLocal(); throw new Error('Your login expired. Please sign in again.'); }
}
function signOutLocal(){ session = null; me = null; store.del('rasc.session'); }
async function signOut(){ try { if (session) await fetch(URL_ + '/auth/v1/logout', {method:'POST', headers:{apikey:KEY, Authorization:'Bearer ' + session.access_token}}); } catch(e){} signOutLocal(); sheet = null; route = {tab:'home'}; render(); }

function friendly(j, status){
  const m = (j && (j.message || j.hint || j.details)) || '';
  if (/row-level security|permission denied/i.test(m)) return 'You do not have permission to do this.';
  if (/duplicate key|already exists/i.test(m)){
    if (/admission_no/.test(m)) return 'This admission number is already used.';
    if (/roll_no/.test(m)) return 'This roll number is already used in this class.';
    if (/employee_no/.test(m)) return 'This employee number is already used.';
    if (/attendance/.test(m)) return 'Attendance for this day is already saved.';
    return 'This record already exists.';
  }
  if (/violates check constraint/i.test(m)) return 'Some values are not allowed. Please check the form.';
  if (/foreign key/i.test(m)) return 'This is linked to other records and cannot be changed.';
  if (status === 401) return 'Your login expired. Please sign in again.';
  return m || 'Something went wrong (' + status + '). Check your internet and try again.';
}
async function api(path, {method = 'GET', body, prefer} = {}){
  const token = await freshToken();
  let r;
  try {
    r = await fetch(URL_ + '/rest/v1/' + path, {method, headers:{apikey:KEY, ...(token ? {Authorization:'Bearer ' + token} : {}), 'Content-Type':'application/json', ...(prefer ? {Prefer:prefer} : {})}, body:body === undefined ? undefined : JSON.stringify(body)});
  } catch(e){ throw new Error('No internet connection. Please try again.'); }
  if (r.status === 401 && session){ signOutLocal(); render(); }
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok) throw new Error(friendly(j, r.status));
  return j;
}
const get = (p) => api(p);
const ins = (table, body, extra = '') => api(table + extra, {method:'POST', body, prefer:'return=representation'});
const upd = (table, filter, body) => api(table + '?' + filter, {method:'PATCH', body, prefer:'return=representation'});
const upsert = (table, body, onConflict) => api(table + '?on_conflict=' + onConflict, {method:'POST', body, prefer:'resolution=merge-duplicates,return=representation'});
const rpc = (fn, args) => api('rpc/' + fn, {method:'POST', body:args || {}});

async function loadMe(){
  const uid = session.user.id;
  const [p] = await get(`profiles?user_id=eq.${uid}&select=*`);
  me = {profile:p || null};
  if (!p || p.status !== 'active') return;
  const [campus] = await get('campuses?select=*&order=created_at&limit=1');
  const [year] = await get('academic_years?is_current=eq.true&select=*&limit=1');
  const sections = await get('sections?select=id,name,class_id,classes(id,name,sort_order)');
  const subjects = await get('subjects?select=id,name&order=name');
  const grades = await get('grading_schemes?select=grade,min_percent,max_percent');
  sections.forEach(s => s.label = s.classes ? (s.name && s.name !== '-' ? `${s.classes.name} – ${s.name}` : s.classes.name) : s.name);
  sections.sort((a, b) => (a.classes?.sort_order ?? 0) - (b.classes?.sort_order ?? 0) || a.label.localeCompare(b.label));
  ctx = {campus, year, sections, subjects, grades};
  if (p.role === 'teacher'){
    const [tr] = await get(`teachers?user_id=eq.${uid}&select=*`);
    me.teacher = tr;
    me.assign = tr && year ? await get(`teacher_assignments?teacher_id=eq.${tr.id}&academic_year_id=eq.${year.id}&select=id,section_id,subject_id`) : [];
  }
  if (p.role === 'student'){
    me.kids = await get(`students?user_id=eq.${uid}&select=id,full_name,admission_no,student_enrollments(section_id,roll_no,academic_year_id,status)`);
  }
  if (p.role === 'parent'){

    me.kids = pa ? (await get(`student_parents?parent_id=eq.${pa.id}&select=students(id,full_name,admission_no,student_enrollments(section_id,roll_no,academic_year_id,status))`)).map(x => x.students).filter(Boolean) : [];
  }
}

function calendarHtml(rows, monthIso){
  const first = new Date(monthIso + 'T00:00:00'); const y = first.getFullYear(), m = first.getMonth();
  const days = new Date(y, m + 1, 0).getDate(); const lead = (first.getDay() + 6) % 7; const td = today();
  const map = {}; rows.forEach(r => map[r.date] = r.status);
  let cells = ['M','T','W','T','F','S','S'].map(d => `<div class="h">${d}</div>`).join('') + '<div></div>'.repeat(lead);
  for (let d = 1; d <= days; d++){ const k = iso(new Date(y, m, d)); const st = map[k];
    cells += `<div class="d ${st || (new Date(y, m, d).getDay() === 0 || k > td ? 'off' : '')}" title="${k}${st ? ' · ' + st : ''}">${d}</div>`; }
  return `<div class="card"><div class="cal">${cells}</div><div class="row" style="gap:8px"><span class="pill p-ok">Present</span><span class="pill p-bad">Absent</span><span class="pill p-warn">Late</span><span class="pill p-info">Leave</span></div></div>`;
}

  const admin = me.profile.role === 'admin';
  const dayList = Object.keys(days).sort().reverse().map(d => { const l = days[d]; const c = {P:0, A:0, L:0, V:0}; l.forEach(r => c[ST[r.status]]++);

    return admin ? `<button class="item" data-attday="${secId}|${d}">${inner}</button>` : `<div class="item">${inner}</div>`; }).join('');
  const stuList = Object.keys(name).map(id => ({id, n:name[id], p:per[id]})).sort((a, b) => ((a.p ? a.p.pr / a.p.n : 1) - (b.p ? b.p.pr / b.p.n : 1)))
    .map(x => { const pc = x.p && x.p.n ? Math.round(x.p.pr / x.p.n * 100) : null;
      return `<div class="item"><div class="main"><b>${esc(x.n)}</b><span>${x.p ? x.p.a + ' absent in ' + x.p.n + ' days' : 'No record yet'}</span><div class="bar" style="margin-top:6px"><i style="width:${pc ?? 0}%"></i></div></div><span class="pill ${pc != null && pc < 75 ? 'p-bad' : 'p-ok'}">${pc == null ? '–' : pc + '%'}</span></div>`; }).join('');

async function uploadMaterial(file, secId){
  const token = await freshToken();
  const ext = ((file.name || '').split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'bin';
  const path = `${secId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  let r;
  try { r = await fetch(`${URL_}/storage/v1/object/materials/${path}`, {method:'POST', headers:{apikey:KEY, Authorization:'Bearer ' + token, 'Content-Type':file.type || 'application/octet-stream', 'x-upsert':'false'}, body:file}); }
  catch(e){ throw new Error('Upload failed. Check your internet and try again.'); }
  if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(/row-level|Unauthorized|permission/i.test(j.message || j.error || '') ? 'You do not have permission to upload. (Has database update 3 been run?)' : 'Upload failed: ' + (j.message || j.error || r.status)); }
  return path;
}
async function signedUrl(path){
  const token = await freshToken();
  const r = await fetch(`${URL_}/storage/v1/object/sign/materials/${path}`, {method:'POST', headers:{apikey:KEY, Authorization:'Bearer ' + token, 'Content-Type':'application/json'}, body:JSON.stringify({expiresIn:3600})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !(j.signedURL || j.signedUrl)) throw new Error('Could not open this file.');
  const s = j.signedURL || j.signedUrl; return s.startsWith('http') ? s : URL_ + '/storage/v1' + s;
}

async function payForm(sid){
  const studs = (await allStudents(true)).filter(s => s.status === 'active');
  if (!studs.length) return `<h2>${t('Record payment')}</h2>${empty('Add students first.')}<button class="btn alt" data-act="close">${t('Close')}</button>`;
  const [bal, fams] = await Promise.all([get('invoice_balances?balance=gt.0&select=student_id,balance'), get('families?select=id,name,monthly_fee')]);
  const due = {}; bal.forEach(b => due[b.student_id] = (due[b.student_id] || 0) + Number(b.balance));
  const famFee = {}; fams.forEach(f => { if (f.monthly_fee != null) famFee[f.id] = f; });
  const payer = (fid) => studs.filter(s => s.family_id === fid).sort((a, b) => String(a.admission_date).localeCompare(String(b.admission_date)) || String(a.admission_no).localeCompare(String(b.admission_no)))[0]?.id;
  const acct = (s) => s.family_id && famFee[s.family_id] ? (payer(s.family_id) || s.id) : s.id;
  UI.payAcct = {}; studs.forEach(s => UI.payAcct[s.id] = acct(s));
  sid = sid || studs.find(s => due[acct(s)])?.id || studs[0].id;
  const opts = studs.slice().sort((a, b) => (due[acct(b)] || 0) - (due[acct(a)] || 0) || a.full_name.localeCompare(b.full_name));
  setTimeout(() => loadPayDues(), 0);
  return `<h2>${t('Record payment')}</h2><form class="form" id="fPay" novalidate>
    <label class="f">Student<select id="fpSid">${opts.map(s => `<option value="${s.id}" ${s.id === sid ? 'selected' : ''}>${esc(s.full_name)} (${esc(s.admission_no)})${s.family_id && famFee[s.family_id] ? ' · family' : ''} — due ${pkr(due[acct(s)] || 0)}</option>`).join('')}</select></label>
    <div id="payDues"><div class="skel"></div></div>
    <label class="f">Amount received now (Rs) *<input id="fpAmt" inputmode="numeric" autocomplete="off"></label>
    <div class="calc" id="payCalc"><div><small>Total due</small><b id="pcDue">–</b></div><div><small>Paying now</small><b id="pcNow" style="color:var(--ok)">–</b></div><div><small>Remaining</small><b id="pcLeft" style="color:var(--bad)">–</b></div></div>
    <div class="grid2"><label class="f">Method<select id="fpMethod"><option value="cash">Cash</option><option value="jazzcash">JazzCash</option><option value="easypaisa">Easypaisa</option><option value="bank">Bank</option><option value="other">Other</option></select></label>
    <label class="f">Transaction ID<input id="fpRef" autocomplete="off" placeholder="JazzCash / bank"></label></div>
    <label class="f">Note (optional)<input id="fpNote"></label>
    <p class="note">Money goes to the oldest pending month first. Extra money stays as advance for next month.</p>
    <p class="err" id="fpErr" hidden></p><button class="btn acc" type="submit">Save and create receipt</button><button class="btn alt" type="button" data-act="close">Cancel</button></form>`;
}
async function loadPayDues(){
  const box = $('payDues'); if (!box) return;
  const sid = val('fpSid'); const acct = UI.payAcct?.[sid] || sid;
  box.innerHTML = '<div class="skel"></div>';
  try {
    const [b, inv] = await Promise.all([get(`invoice_balances?student_id=eq.${acct}&balance=gt.0&order=due_date`), get(`invoices?student_id=eq.${acct}&status=eq.issued&select=id,period_month,invoice_items(fee_head)`)]);
    if (val('fpSid') !== sid) return;
    const lab = {}; inv.forEach(i => lab[i.id] = i.period_month ? fmtMonth(i.period_month) + ' fee' : (i.invoice_items?.[0]?.fee_head || 'Dues'));
    const total = b.reduce((a, x) => a + Number(x.balance), 0);
    UI.payDue = total;
    const s = cache.students?.find(x => x.id === acct);
    box.innerHTML = `<div class="card"><div class="between"><b>Pending dues${acct !== sid ? ' (family account: ' + esc(s?.full_name || '') + ')' : ''}</b><button type="button" class="link" data-olddues="${acct}">+ Old dues</button></div>
      ${b.length ? b.map(x => `<div class="between" style="border-top:1px solid var(--line);padding-top:6px"><span>${esc(lab[x.invoice_id] || x.invoice_no)}${Number(x.balance) < Number(x.total) ? ` <span class="note">(${pkr(x.total)} − paid ${pkr(Number(x.paid) + Number(x.concession))})</span>` : ''}</span><b>${pkr(x.balance)}</b></div>`).join('') : '<span class="note">No pending dues. Any amount will be kept as advance.</span>'}
      ${b.length ? `<div class="row"><button type="button" class="btn sm alt" data-fill="${Math.round(total)}">Full ${pkr(total)}</button>${b.length > 1 ? `<button type="button" class="btn sm alt" data-fill="${Math.round(Number(b[0].balance))}">Only ${esc(lab[b[0].invoice_id] || 'oldest')}</button>` : ''}</div>` : ''}</div>`;
    const a = $('fpAmt'); if (a && !a.value) a.value = Math.round(total) || '';
    payCalc();
  } catch(e){ box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }

document.addEventListener('submit', async (ev) => {
  ev.preventDefault(); const f = ev.target; const btn = f.querySelector('button[type=submit]');
  const err = f.querySelector('.err'); if (err) err.hidden = true;
  const fail = (m) => { if (err){ err.textContent = m; err.hidden = false; } busy(btn, false); };
  busy(btn, true);
  try {
    switch (f.id){
      case 'fLogin': {
        if (!val('lgEmail') || !val('lgPass')) return fail('Type your username and password.');
        await signIn(toEmail(val('lgEmail')), $('lgPass').value); me = null; route = {tab:'home'}; render(); break; }
      case 'fOwner': {
        const email = val('owEmail').toLowerCase(), pass = $('owPass').value;
        if (pass.length < 8) return fail('Use at least 8 characters for the password.');
        let j;
        try { j = await signUp(email, pass); }
        catch(e){ if (!/registered|exists/i.test(e.message)) throw e; j = await authCall('token?grant_type=password', {email, password:pass}).catch(() => { throw new Error('This email already has an account. Go back and sign in with its password.'); }); }
        if (!j.access_token) return fail('Supabase is asking to confirm the email. In Supabase turn OFF "Confirm email" (see the setup page), then try again.');
        keepSession(j); await rpc('claim_owner'); UI.owner = false; me = null; route = {tab:'home'}; render(); toast('Welcome! You are the admin.'); break; }
      case 'fNewPass': {
        const p = $('npPass').value; if (p.length < 8) return fail('Use at least 8 characters.');
        const h = new URLSearchParams(location.hash.slice(1)); const token = h.get('access_token');
        const r = await fetch(URL_ + '/auth/v1/user', {method:'PUT', headers:{apikey:KEY, Authorization:'Bearer ' + token, 'Content-Type':'application/json'}, body:JSON.stringify({password:p})});
        if (!r.ok) return fail('This reset link has expired. Ask for a new one.');
        history.replaceState(null, '', location.pathname); signOutLocal(); render(); toast('Password changed. Please sign in.'); break; }
      case 'fYear': {
        if (!val('yName') || !val('yStart') || !val('yEnd')) return fail('Fill all fields.');
        await upd('academic_years', 'is_current=eq.true', {is_current:false});
        await ins('academic_years', {campus_id:ctx.campus.id, name:val('yName'), starts_on:val('yStart'), ends_on:val('yEnd'), is_current:true});
        await reloadCtx(); toast('Academic year added'); sheetAsync(() => SETUP.year()); break; }
      case 'fClass': {
        if (!val('cName')) return fail('Type the class name.');
        const [c] = await ins('classes', {campus_id:ctx.campus.id, name:val('cName'), sort_order:(ctx.sections.length + 1) * 10});
        const secs = val('cSecs') ? val('cSecs').split(',').map(x => x.trim()).filter(Boolean) : ['-'];
        await ins('sections', secs.map(n => ({class_id:c.id, name:n})));

      case 'fSec': {
        if (!val('secName')) return fail('Type the section name.');
        await ins('sections', {class_id:f.dataset.cls, name:val('secName')}); await reloadCtx(); toast('Section added'); sheetAsync(() => SETUP.classes()); break; }
      case 'fSubj': {
        const names = val('sNames').split(',').map(x => x.trim()).filter(Boolean); if (!names.length) return fail('Type at least one subject.');
        const have = new Set(ctx.subjects.map(s => s.name.toLowerCase()));

        await reloadCtx(); toast(add.length + ' subject(s) added'); sheetAsync(() => SETUP.subjects()); break; }
      case 'fAcademy': {
        if (!val('aName') || !val('aAddr') || !val('aPhone')) return fail('Name, address and phone are required.');
        await upd('campuses', 'id=eq.' + ctx.campus.id, {name:val('aName'), address:val('aAddr'), phone:val('aPhone'), whatsapp:val('aWa') || null});
        await reloadCtx(); toast('Saved'); closeSheet(); render(); break; }
      case 'fTeacher': {
        if (!val('tNo') || !val('tName')) return fail('Employee no. and name are required.');
        await ins('teachers', {campus_id:ctx.campus.id, employee_no:val('tNo'), full_name:val('tName'), phone:val('tPhone') || null, email:val('tEmail') || null});
        toast('Teacher added'); sheetAsync(() => SETUP.teachers()); break; }
      case 'fAssign': {
        await ins('teacher_assignments', {teacher_id:f.dataset.tid, section_id:val('asSec'), subject_id:val('asSub'), academic_year_id:ctx.year.id});
        toast('Class assigned'); sheetAsync(() => SETUP.teachers()); break; }
      case 'fExam': {
        if (!val('eName')) return fail('Type the exam name.');
        await ins('exams', {campus_id:ctx.campus.id, academic_year_id:ctx.year.id, name:val('eName'), starts_on:val('eDate') || null});
        toast('Exam created. Now add papers.'); sheetAsync(() => SETUP.exams()); break; }
      case 'fPaper': {
        const mx = Number(val('pMax')), ps = Number(val('pPass'));
        if (!(mx > 0) || !(ps >= 0) || ps > mx) return fail('Total must be above 0 and pass marks cannot be more than total.');
        await ins('exam_subjects', {exam_id:f.dataset.exam, class_id:val('pClass'), subject_id:val('pSubj'), max_marks:mx, pass_marks:ps, exam_date:val('pDate') || null});
        toast('Paper added'); sheetAsync(() => SETUP.exams()); break; }
      case 'fStudent': {
        if (!val('fsName') || !val('fsFather') || !val('fsPhone') || !val('fsAdm')) return fail('Please fill admission no., name, guardian name and phone.');
        if (!$('fsConsent').checked) return fail('Please confirm the guardian agreed (tick the box).');
        const secId = val('fsSec'); let roll = val('fsRoll');
        if (!roll){ const r = await get(`student_enrollments?section_id=eq.${secId}&academic_year_id=eq.${ctx.year.id}&select=roll_no`); roll = String(r.reduce((m, x) => Math.max(m, parseInt(x.roll_no) || 0), 0) + 1); }
        const body = {admission_no:val('fsAdm'), full_name:val('fsName'), father_name:val('fsFather'), gender:val('fsGender'), guardian_phone:val('fsPhone'), address:val('fsAddr') || null};
        if (f.dataset.id){
          await upd('students', 'id=eq.' + f.dataset.id, body);
          const s = cache.students.find(x => x.id === f.dataset.id); const en = currentEnroll(s);
          if (en) await upd('student_enrollments', 'id=eq.' + en.id, {section_id:secId, roll_no:roll});
          else await ins('student_enrollments', {student_id:f.dataset.id, academic_year_id:ctx.year.id, section_id:secId, roll_no:roll});
          cache.students = null; toast('Saved'); sheetAsync(() => studentDetail(f.dataset.id));
        } else {
          let famId = null, sib = null;
          if (f.dataset.sib){ sib = (await allStudents(true)).find(x => x.id === f.dataset.sib); famId = sib?.family_id || null;
            if (sib && !famId){ const [fm] = await ins('families', {campus_id:ctx.campus.id, name:(sib.father_name || sib.full_name) + ' family', phone:sib.guardian_phone || null}); famId = fm.id; await upd('students', 'id=eq.' + sib.id, {family_id:famId}); } }
          const [s] = await ins('students', {...body, campus_id:ctx.campus.id, admission_date:val('fsDate') || today(), family_id:famId});
          try { await ins('student_enrollments', {student_id:s.id, academic_year_id:ctx.year.id, section_id:secId, roll_no:roll}); }
          catch(e){ await upd('students', 'id=eq.' + s.id, {status:'withdrawn'}); throw e; }
          if (sib){ const ps = await get(`student_parents?student_id=eq.${sib.id}&select=parent_id`);
            for (const x of ps) await api('student_parents?on_conflict=student_id,parent_id', {method:'POST', body:{student_id:s.id, parent_id:x.parent_id}, prefer:'resolution=ignore-duplicates'}); }
          cache.students = null; toast(`Added ${s.admission_no}, roll ${roll}`); render(); sheetAsync(() => studentDetail(s.id));
        }
        break; }
      case 'fFamFee': {
        const v = val('ffAmt'); const amt = v === '' ? null : Math.round(Number(v));
        if (v !== '' && !(amt >= 0)) return fail('Fee must be a number.');
        await upd('families', 'id=eq.' + f.dataset.fam, {name:val('ffName') || 'Family', monthly_fee:amt});
        cache.students = null; toast(amt == null ? 'Each child will pay own class fee' : 'Family fee saved: ' + pkr(amt) + ' per month'); closeSheet(); render(); break; }
      case 'fParent': {
        if (!val('paName') || !val('paPhone')) return fail('Name and phone are required.');
        const phone = val('paPhone'); let [p] = await get(`parents?phone=eq.${enc(phone)}&select=id`);
        if (!p) [p] = await ins('parents', {campus_id:ctx.campus.id, full_name:val('paName'), relation:val('paRel'), phone, verified_at:$('paVer').checked ? new Date().toISOString() : null});
        else if ($('paVer').checked) await upd('parents', 'id=eq.' + p.id, {verified_at:new Date().toISOString()});
        await api('student_parents?on_conflict=student_id,parent_id', {method:'POST', body:{student_id:f.dataset.sid, parent_id:p.id}, prefer:'resolution=ignore-duplicates'});
        toast('Parent linked'); sheetAsync(() => studentDetail(f.dataset.sid)); break; }
      case 'fLink': {
        const user = val('lkUser'), pass = val('lkPass');
        if (!user || pass.length < 6) return fail('Username is needed and the password must be at least 6 characters.');
        const email = toEmail(user); let created = true;
        try { await signUp(email, pass); }
        catch(e){ if (/registered|exists/i.test(e.message)) created = false; else throw e; }
        await rpc('admin_link_login', {p_email:email, p_kind:f.dataset.kind, p_record_id:f.dataset.id});
        cache.students = null; const card = `Username: ${fromEmail(email)}\nPassword: ${created ? pass : '(unchanged — the old password still works)'}`;
        openSheet(`<h2>Login ready</h2><div class="card"><b style="font-size:18px;white-space:pre-line;user-select:all">${esc(card)}</b></div>
          <p class="note">Give these to the person. They open the app and sign in with this username and password.</p>
          <div class="grid2"><button class="btn alt" data-act="copyLogin" data-txt="${esc(card)}">Copy</button><button class="btn" data-act="close">Done</button></div>`); render(); break; }
      case 'fRen': {
        if (!val('rnName')) return fail('Type a name.');
        await upd(f.dataset.table, 'id=eq.' + f.dataset.id, {name:val('rnName')}); await reloadCtx(); toast('Renamed'); sheetAsync(() => SETUP.classes()); break; }
      case 'fExp': {
        const amt = Math.round(Number(val('exAmt'))); if (!(amt > 0)) return fail('Enter the amount.');
        await ins('expenses', {campus_id:ctx.campus.id, category:val('exCat'), amount:amt, spent_on:val('exDate') || today(), note:val('exNote') || null});
        toast('Expense saved'); sheetAsync(() => SETUP.expenses()); break; }
      case 'fDues': {
        const amt = Math.round(Number(val('duAmt'))); if (!(amt > 0)) return fail('Enter the amount.');
        await rpc('add_pending_dues', {p_student:f.dataset.acct, p_amount:amt, p_note:val('duNote') || null});
        toast('Old dues added: ' + pkr(amt)); cache.students = null; closeSheet(); render(); break; }
      case 'fDisc': {
        const amt = Math.round(Number(val('dcAmt'))); const mx = Number(f.dataset.max);
        if (!(amt > 0)) return fail('Enter the discount amount.'); if (amt > mx) return fail('Discount cannot be more than ' + pkr(mx) + '.');
        await ins('concessions', {invoice_id:f.dataset.inv, amount:amt, reason:val('dcWhy')});
        toast('Discount applied: ' + pkr(amt)); closeSheet(); render(); break; }
      case 'fPay': {
        const amt = Math.round(Number(val('fpAmt'))); const m = val('fpMethod');
        if (!amt || amt <= 0) return fail('Enter an amount above zero.');
        if (['jazzcash','easypaisa','bank'].includes(m) && !val('fpRef')) return fail('Add the transaction ID for ' + m + ' payments.');
        const acctId = (await rpc('fee_account_for', {p_student:val('fpSid')})) || val('fpSid');
        const p = await rpc('record_payment', {p_student_id:acctId, p_amount:amt, p_method:m, p_transaction_ref:val('fpRef') || null, p_paid_on:today(), p_note:val('fpNote') || null});
        toast('Payment saved · ' + p.receipt_no); render(); sheetAsync(() => receiptHtml(p.id)); break; }
      case 'fFees': {
        const inputs = [...f.querySelectorAll('[data-feeclass]')];
        const plans = await get(`fee_plans?academic_year_id=eq.${ctx.year.id}&select=id,class_id,fee_plan_items(id,frequency)`);
        for (const inp of inputs){ const v = inp.value.trim(); if (v === '') continue; const amt = Math.round(Number(v)); if (!(amt >= 0)) return fail('Fees must be numbers.');
          let plan = plans.find(p => p.class_id === inp.dataset.feeclass);
          if (!plan) [plan] = await ins('fee_plans', {campus_id:ctx.campus.id, class_id:inp.dataset.feeclass, academic_year_id:ctx.year.id, name:'Monthly tuition'});
          const it = plan.fee_plan_items?.find(i => i.frequency === 'monthly');
          if (it) await upd('fee_plan_items', 'id=eq.' + it.id, {amount:amt}); else await ins('fee_plan_items', {fee_plan_id:plan.id, fee_head:'Tuition fee', amount:amt, frequency:'monthly'}); }
        toast('Monthly fees saved'); closeSheet(); render(); break; }
      case 'fGen': {
        if (!val('gMonth') || !val('gDue')) return fail('Choose the month and due date.');
        let total = 0; const skipped = [];
        for (const s of ctx.sections){ try { total += await rpc('generate_monthly_invoices', {p_section_id:s.id, p_month:val('gMonth') + '-01', p_due:val('gDue')}); } catch(e){ skipped.push(s.label + ': ' + e.message); } }
        if (skipped.length && !total) return fail(skipped.join(' · '));
        toast(`${total} invoice(s) created` + (skipped.length ? ` · ${skipped.length} class(es) skipped (no fee set)` : '')); closeSheet(); render(); break; }
      case 'fNotice': {
        if (!val('nTitle') || !val('nBody')) return fail('Add a title and a message.');
        await ins('announcements', {campus_id:ctx.campus.id, title:val('nTitle'), body:val('nBody'), audience_role:val('nAud'), section_id:val('nSec') || null, published_at:new Date().toISOString()});
        toast('Notice published'); closeSheet(); render(); break; }
      case 'fMat': {
        if (!val('mtTitle')) return fail('Add a title.');
        let sec, sub; if ($('mtAs')) [sec, sub] = val('mtAs').split('|'); else { sec = val('mtSec'); sub = val('mtSub'); }
        const kind = val('mtKind'); const row = {section_id:sec, subject_id:sub, title:val('mtTitle'), kind};
        if (kind === 'file'){ const file = $('mtFile').files[0]; if (!file) return fail('Choose a PDF or photo.'); if (file.size > 20 * 1024 * 1024) return fail('This file is bigger than 20 MB. Please choose a smaller file.');
          btn.textContent = 'Uploading…'; row.url_or_path = await uploadMaterial(file, sec); }
        else if (kind === 'note'){ if (!val('mtText')) return fail('Write the note.'); row.details = val('mtText'); row.url_or_path = null; }
        else { const u = val('mtUrl'); if (!/^https?:\/\//i.test(u)) return fail('Paste a full link starting with https://'); row.url_or_path = u; }
        await ins('study_materials', row);
        toast('Added. Students of this class can see it now.'); if (me.profile.role === 'admin') sheetAsync(() => SETUP.materials()); else { closeSheet(); render(); } break; }
      case 'fHw': {
        if (!val('hwTitle') || !val('hwDue')) return fail('Add a title and due date.');
        const [sec, sub] = val('hwAs').split('|');
        await ins('homework', {section_id:sec, subject_id:sub, title:val('hwTitle'), details:val('hwDet') || null, due_date:val('hwDue')});
        toast('Homework posted'); closeSheet(); render(); break; }
    }
  } catch(e){ fail(e.message); }
});

const APP_VERSION = 4;
(function(){ if (!/^https?:$/.test(location.protocol) || location.hostname === 'localhost') return;
  const next = `rasc-v${APP_VERSION + 1}.html`;
  fetch(next, {method:'HEAD', cache:'no-store'}).then(r => { if (r.ok) location.replace(next + location.hash); }).catch(() => {}); })();
render();
</script>
